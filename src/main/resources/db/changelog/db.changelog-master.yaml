databaseChangeLog:
  - changeSet:
      id: 1-courts-surfaces
      author: application
      changes:
        - sql:
            sql: |
              CREATE TABLE mutation_guard (id INT PRIMARY KEY);
              INSERT INTO mutation_guard (id) VALUES (1);
              CREATE TABLE surface (id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, created_at TIMESTAMP NOT NULL, updated_at TIMESTAMP NOT NULL, removed_at TIMESTAMP, name VARCHAR(50) NOT NULL, active_name VARCHAR(100) UNIQUE, price_per_minute DECIMAL(6,2) NOT NULL);
              CREATE TABLE court (id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, created_at TIMESTAMP NOT NULL, updated_at TIMESTAMP NOT NULL, removed_at TIMESTAMP, court_number INT NOT NULL, active_number INT UNIQUE, surface_id BIGINT NOT NULL REFERENCES surface(id));
