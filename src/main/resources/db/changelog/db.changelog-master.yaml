databaseChangeLog:
  - changeSet:
      id: 1-courts-surfaces
      author: application
      changes:
        - sql:
            sql: |
              CREATE TABLE mutation_guard (id INT PRIMARY KEY);
              INSERT INTO mutation_guard (id) VALUES (1);
              CREATE TABLE surface (id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, created_at TIMESTAMP NOT NULL, updated_at TIMESTAMP NOT NULL, removed_at TIMESTAMP, name VARCHAR(50) NOT NULL, active_name VARCHAR(100) UNIQUE, price_per_minute DECIMAL(6,2) NOT NULL);
              CREATE TABLE court (id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, created_at TIMESTAMP NOT NULL, updated_at TIMESTAMP NOT NULL, removed_at TIMESTAMP, court_number INT NOT NULL, active_number INT UNIQUE, surface_id BIGINT NOT NULL REFERENCES surface(id));
  - changeSet:
      id: 2-seed-courts-surfaces
      author: application
      preConditions:
        - onFail: CONTINUE
        - onError: HALT
        - sqlCheck:
            expectedResult: "true"
            sql: SELECT '${seed-enabled}'
      changes:
        - sql:
            sql: |
              INSERT INTO surface (created_at, updated_at, name, active_name, price_per_minute) VALUES (CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 'Clay', 'clay', 3.60);
              INSERT INTO surface (created_at, updated_at, name, active_name, price_per_minute) VALUES (CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 'Hard', 'hard', 5.00);
              INSERT INTO court (created_at, updated_at, court_number, active_number, surface_id) VALUES (CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 1, 1, (SELECT id FROM surface WHERE active_name = 'clay'));
              INSERT INTO court (created_at, updated_at, court_number, active_number, surface_id) VALUES (CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 2, 2, (SELECT id FROM surface WHERE active_name = 'clay'));
              INSERT INTO court (created_at, updated_at, court_number, active_number, surface_id) VALUES (CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 3, 3, (SELECT id FROM surface WHERE active_name = 'hard'));
              INSERT INTO court (created_at, updated_at, court_number, active_number, surface_id) VALUES (CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 4, 4, (SELECT id FROM surface WHERE active_name = 'hard'));
  - changeSet:
      id: 3-reservations
      author: application
      changes:
        - sql:
            sql: |
              CREATE TABLE customer (id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, created_at TIMESTAMP NOT NULL, updated_at TIMESTAMP NOT NULL, removed_at TIMESTAMP, name VARCHAR(50) NOT NULL, phone_number VARCHAR(100) NOT NULL UNIQUE);
              CREATE TABLE reservation (id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, created_at TIMESTAMP NOT NULL, updated_at TIMESTAMP NOT NULL, removed_at TIMESTAMP, court_id BIGINT NOT NULL REFERENCES court(id), customer_id BIGINT NOT NULL REFERENCES customer(id), start_time TIMESTAMP WITH TIME ZONE NOT NULL, end_time TIMESTAMP WITH TIME ZONE NOT NULL, game_type VARCHAR(20) NOT NULL, total_price DECIMAL(9,2) NOT NULL);
  - changeSet:
      id: 4-accounts
      author: application
      changes:
        - sql:
            sql: |
              CREATE TABLE account_role (id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, role VARCHAR(20) NOT NULL UNIQUE);
              CREATE TABLE user_account (id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, created_at TIMESTAMP NOT NULL, updated_at TIMESTAMP NOT NULL, removed_at TIMESTAMP, username VARCHAR(50) NOT NULL, active_username VARCHAR(50) UNIQUE, password_hash VARCHAR(100) NOT NULL, credential_version BIGINT NOT NULL, role_id BIGINT NOT NULL REFERENCES account_role(id));
              INSERT INTO account_role (role) VALUES ('USER'), ('ADMIN');
  - changeSet:
      id: 5-admin-seed
      author: application
      changes:
        - sql:
            sql: |
              INSERT INTO user_account (created_at, updated_at, username, active_username, password_hash, credential_version, role_id) VALUES (CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 'admin', 'admin', '$2b$12$v4057K5aJk0M6UiuqAap/.yue35SD.Fih0N5zT2tIfPwjSWCWsocK', 0, (SELECT id FROM account_role WHERE role = 'ADMIN'));
