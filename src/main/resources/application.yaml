spring:
  application:
    name: tenis-club-reservations

  liquibase:
    parameters:
      seed-enabled: ${SEED_DATA_ENABLED:false}

  jpa:
    hibernate:
      ddl-auto: validate

  jackson:
    deserialization:
      use-big-decimal-for-floats: true

springdoc:
  override-with-generic-response: false
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET:}
    lifetime: ${JWT_LIFETIME:1h}
    refresh-window: ${JWT_REFRESH_WINDOW:15m}
